name: SchemaSpy · Vessels Database Visualization

# Generates an interactive SchemaSpy HTML database report and ER diagrams
# strictly for the `vessels` schema (-s vessels), excluding `animals` and `core`.
#
# - On every pull request and push: uploads the full HTML + ER diagram bundle
#   as the `schemaspy-vessels-report` workflow artifact.
# - On push to `main` (or manual workflow_dispatch): also publishes the
#   interactive SchemaSpy site to GitHub Pages.

on:
  pull_request:
    paths:
      - 'backend/src/main/resources/vessels/db/**'
      - '.github/workflows/schemaspy.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/main/resources/vessels/db/**'
      - '.github/workflows/schemaspy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: schemaspy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schemaspy:
    name: schemaspy · vessels schema
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: animals
          POSTGRES_USER: animals
          POSTGRES_PASSWORD: animals
        ports:
          - 18520:5432
        options: >-
          --health-cmd="pg_isready -U animals -d animals"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply Liquibase migrations to PostgreSQL
        working-directory: backend
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew bootRun --console=plain \
            --args="--spring.main.web-application-type=none"

      - name: Generate SchemaSpy report for `vessels` schema only
        run: |
          mkdir -p "${{ github.workspace }}/schemaspy-output"
          chmod 777 "${{ github.workspace }}/schemaspy-output"
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/schemaspy-output:/output" \
            schemaspy/schemaspy:latest \
            -t pgsql11 \
            -host localhost \
            -port 18520 \
            -db animals \
            -u animals \
            -p animals \
            -s vessels

      - name: Upload SchemaSpy HTML + ER diagrams artifact
        uses: actions/upload-artifact@v4
        with:
          name: schemaspy-vessels-report
          path: schemaspy-output
          retention-days: 30

      - name: Upload GitHub Pages artifact (main / manual run)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: schemaspy-output

  deploy-pages:
    name: pages · publish SchemaSpy report
    needs: schemaspy
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
